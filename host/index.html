<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spectrum/<title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --paper: #eef1ec; --ink: #14231f; --muted: #5c6b66; --teal: #1f6f5c; --line: #cdd6d0; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #0f1a17; --ink: #e8efea; --muted: #93a39c; --teal: #3fb597; --line: #2a3b35; }
    }
    html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink);
      font-family: system-ui, sans-serif; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
    #status[hidden] { display: none; }
    #status .box { max-width: 420px; }
    #status code { background: var(--line); padding: 2px 6px; border-radius: 4px; word-break: break-all; }
    #status a { color: var(--teal); }
    #status ul { text-align: left; }
  </style>
</head>
<body>
  <div id="status">
    <div class="box">
      <p id="statusText">Loading Spectrum…</p>
    </div>
  </div>
  <iframe id="app" title="Ledgerline" hidden
          allow="payment"
          sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>

  <script>
    // 1. Set this to your deployed Angular app's Render URL — no trailing slash.
    var APP_URL = "https://lagadis.onrender.com";

    var frame = document.getElementById("app");
    var statusBox = document.getElementById("status");
    var statusText = document.getElementById("statusText");
    var path = location.hash ? location.hash.slice(1) : "/login";
    var loaded = false;

    if (APP_URL.indexOf("YOUR-SERVICE") !== -1) {
      statusText.innerHTML = "Set <code>APP_URL</code> at the top of this file's script "
        + "to your deployed app's Render URL, then reload.";
    } else {
      frame.addEventListener("load", function () {
        loaded = true;
        statusBox.hidden = true;
        frame.hidden = false;
      });
      frame.src = APP_URL + path;

      // iframe 'load' fires even when the server refuses to be framed (X-Frame-Options/CSP),
      // since that's a same-document navigation the browser still reports as "loaded" while
      // showing it blank — so also watch for the frame staying empty.
      setTimeout(function () {
        if (!loaded) {
          statusText.innerHTML = "Still waking the server, this can take up to a minute on Render's free tier…";
        }
      }, 6000);

      setTimeout(function () {
        var blocked = false;
        try { blocked = !frame.contentWindow || frame.contentWindow.length === 0; } catch (e) { /* cross-origin: fine, means it loaded */ }
        if (!statusBox.hidden) {
          statusText.innerHTML =
            "The app didn't load. Likely causes:" +
            "<ul>" +
            "<li>The Render app isn't deployed yet, or <code>APP_URL</code> is wrong — " +
            "<a href='" + APP_URL + path + "' target='_blank' rel='noopener'>open it directly</a> to check.</li>" +
            "<li>Render is still sending <code>X-Frame-Options: DENY</code> instead of the CSP " +
            "<code>frame-ancestors</code> rule — redeploy the app after the render.yaml change.</li>" +
            "<li><code>frame-ancestors</code> in render.yaml doesn't include this page's origin " +
            "(<code>" + location.origin + "</code>).</li>" +
            "<li>This file is opened as a local <code>file://</code> page — serve it over http(s) instead.</li>" +
            "</ul>";
        }
      }, 12000);
    }
  </script>
</body>
</html>
